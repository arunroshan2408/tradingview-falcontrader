<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FalconTrader Paper Terminal</title>
<style>
:root{--bg:#0a1017;--p:#121a24;--p2:#18232f;--ln:#243142;--ink:#e7eef5;--mut:#8394a6;--up:#2ecc8f;--dn:#f06a6a;--ac:#c4f04d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:196px;background:var(--p);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:15px;margin:0 8px 2px;letter-spacing:.05em}nav small{display:block;margin:0 8px 18px;color:var(--mut);font-size:11px;letter-spacing:.14em}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--mut);cursor:pointer;margin-bottom:2px}nav a.on{background:var(--p2);color:var(--ac)}
main{flex:1;min-width:0;padding:16px 22px 40px}.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.sp{flex:1}
.top button,.top select,.b{background:var(--p);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.top button.on{background:var(--ac);border-color:var(--ac);color:#10200a;font-weight:600}.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block;margin-right:6px}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:16px}
.acc div{background:var(--p);padding:12px 16px}.acc span,.k span{color:var(--mut);font-size:12px;display:block}.acc b{font-size:22px;font-variant-numeric:tabular-nums}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:16px}.pn{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:16px;min-width:0}
.pn h3{margin:0 0 12px;font-size:15px}.pn h3 small{color:var(--mut);font-weight:400;margin-left:8px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.k div{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:14px 16px}.k b{font-size:24px;font-variant-numeric:tabular-nums}
.w{overflow:auto;max-height:480px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--p);color:var(--mut);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--ln)}td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}tr:hover td{background:var(--p2)}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mut)}
.bar{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;margin:8px 0}.bar i{display:block;height:8px;border-radius:4px}.bar b{text-align:right;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 110px;gap:6px}.cal u{text-decoration:none;color:var(--mut);font-size:12px;text-align:center;padding:4px}
.cal i{font-style:normal;min-height:84px;border:1px solid var(--ln);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;background:var(--p2);cursor:pointer}
.cal i.off{background:transparent;border-color:transparent;cursor:default}.cal i.wk{background:var(--p);cursor:default}.cal i.sel{outline:2px solid var(--ac)}.cal i.td{border-color:var(--ac)}
.cal span{color:var(--mut);font-size:12px}.cal b{font-size:15px}.cal em{font-style:normal;color:var(--mut);font-size:11px}
.donut{width:150px;height:150px;border-radius:50%;margin:auto;display:grid;place-items:center}.donut div{width:104px;height:104px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-size:22px;font-weight:700}
dialog{background:var(--p);color:var(--ink);border:1px solid var(--ln);border-radius:12px;width:min(380px,92vw)}dialog label{display:block;margin:8px 0 2px;color:var(--mut);font-size:12px}
dialog input,dialog select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:7px}.warn{color:#e0a83a}svg{width:100%;height:210px;display:block}
@media(max-width:820px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:10px}nav h1,nav small{display:none}main{padding:12px}.cal{grid-template-columns:repeat(7,1fr)}.cal i.wk,.cal u:last-child{display:none}.cal i{min-height:56px;padding:3px 4px}.cal em{display:none}}
</style>
<nav><h1>FALCONTRADER</h1><small>PAPER TERMINAL</small><a data-v="ov" class="on">Overview</a><a data-v="tr">Trades</a><a data-v="ca">Calendar</a><a data-v="an">Analytics</a></nav>
<main><div class="top"><button id="tM" class="on">Mirror</button><button id="tR">Realistic</button><select id="sy"><option value="">All symbols</option></select>
<select id="pd"><option value="1">Today</option><option value="7">7 days</option><option value="30" selected>30 days</option><option value="all">All time</option></select><span class="sp"></span>
<span><i class="dot"></i><em id="st" style="font-style:normal;color:var(--mut)">connecting</em></span><button id="se">Settings</button></div>
<div class="acc" id="acc"></div><div id="v"></div></main>
<dialog id="dl"><form method="dialog"><h3 style="margin:0 0 6px">Settings</h3><label>Starting capital (USD)</label><input id="fc" type="number"><label>Symbol</label><select id="fs"></select>
<label>Contracts per trade</label><input id="fq" type="number"><label>Commission per contract per side</label><input id="fm" type="number" step="any"><label>Slippage (ticks)</label><input id="fl" type="number" step="any">
<label>Tick size</label><input id="ft" type="number" step="any"><label>$ per 1.0 price move per contract</label><input id="fp" type="number" step="any"><label>Secret</label><input id="fk" type="password">
<p style="text-align:right"><button class="b" value="x">Close</button> <button class="b" id="sv" type="button">Save</button></p></form></dialog>
<script>
const $=i=>document.getElementById(i);let D,A='MIRROR',V='ov',cm=null,sel=null,rf='';
const sg=(n,s)=>n<0?'−':s&&n>0?'+':'',m=(n,s)=>n==null||isNaN(n)?'–':sg(n,s)+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),c=n=>n>0?'up':n<0?'dn':'';
const ist=t=>new Date(t+19800000).toISOString().slice(5,16).replace('T',' '),dur=ms=>ms<36e5?Math.round(ms/6e4)+'m':(ms/36e5).toFixed(1)+'h',
 ses=t=>{const p=new Date(t+19800000),x=p.getUTCHours()*60+p.getUTCMinutes();return x>=330&&x<810?'Asian':x>=810&&x<1050?'London':x>=1050||x<150?'New York':'Off hours'};
function model(){const I=Object.fromEntries(D.inst.map(i=>[i.sym,i])),pv=s=>(I[s]||{pv:1}).pv,T=D.trades.filter(t=>t.acct==A),y=$('sy').value,pd=$('pd').value,d=new Date(),
 sod=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()),cut=pd=='all'?0:sod-(+pd-1)*864e5,net=t=>t.gross-t.comm,rr=t=>net(t)/(Math.abs(t.entry-t.sl0)*pv(t.sym)*t.q||1),
 fl=t=>{const l=D.last[t.sym];return l?(l.p-t.entry)*t.side*t.qo*pv(t.sym):0},O=T.filter(t=>t.qo>0),CA=T.filter(t=>!t.qo&&(!y||t.sym==y)),CF=T.filter(t=>!t.qo),
 C=CA.filter(t=>t.t1>=cut).sort((a,b)=>a.t1-b.t1),bal=D.cap+CF.reduce((s,t)=>s+net(t),0),flt=O.reduce((s,t)=>s+fl(t),0);
 return{I,pv,y,sod,net,rr,fl,O,CA,C,bal,flt,eq:bal+O.reduce((s,t)=>s+net(t),0)+flt}}
function st(L,M){let e=0,pk=0,dd=0,ms=0,cu=0;const cv=L.map(t=>{const n=M.net(t);e+=n;pk=Math.max(pk,e);dd=Math.max(dd,pk-e);cu=n<=0?cu+1:0;ms=Math.max(ms,cu);return e}),
 W=L.filter(t=>M.net(t)>0),X=L.filter(t=>M.net(t)<=0),gp=W.reduce((a,t)=>a+M.net(t),0),gl=X.reduce((a,t)=>a-M.net(t),0);
 return{n:L.length,w:W.length,net:e,pf:gl?gp/gl:null,dd,ms,cv,exp:L.length?e/L.length:0,aw:W.length?gp/W.length:0,al:X.length?-gl/X.length:0,R:L.length?L.reduce((a,t)=>a+M.rr(t),0)/L.length:0,best:Math.max(0,...L.map(M.net)),worst:Math.min(0,...L.map(M.net))}}
const grp=(L,f,M)=>{const o={};L.forEach(t=>{const k=f(t);o[k]=(o[k]||0)+M.net(t)});return o},
 bars=o=>{const e=Object.entries(o),mx=Math.max(1,...e.map(x=>Math.abs(x[1])));return e.length?e.map(([k,v])=>`<div class="bar"><span>${k}</span><div><i style="width:${Math.max(2,Math.abs(v)/mx*100)}%;background:var(--${v>=0?'up':'dn'})"></i></div><b class="${c(v)}">${m(v,1)}</b></div>`).join(''):'<span class="mu">No data in this period.</span>'};
function strip(M){const t=M.CA.filter(x=>x.t1>=M.sod).reduce((s,x)=>s+M.net(x),0);
 $('acc').innerHTML=[['Balance',m(M.bal),''],['Equity',m(M.eq),''],['Floating P&L',m(M.flt,1),c(M.flt)],['Today',m(t,1),c(t)],['Open positions',M.O.length,''],['Free capital',m(M.eq-M.O.reduce((s,x)=>s+(M.I[x.sym]?0:0),0)),'']].slice(0,5).map(x=>`<div><span>${x[0]}</span><b class="${x[2]}">${x[1]}</b></div>`).join('')}
function ov(M){const S=st(M.C,M),lo=Math.min(0,...S.cv),hi=Math.max(0,...S.cv),Y=v=>190-(v-lo)/(hi-lo||1)*170,wp=S.n?S.w/S.n*100:0;
 const K=[['Net P&L',`<b class="${c(S.net)}">${m(S.net,1)}</b>`],['Win rate',`<b>${S.n?wp.toFixed(1)+'%':'–'}</b>`],['Profit factor',`<b>${S.pf?S.pf.toFixed(2):S.w?'∞':'–'}</b>`],['Trades',`<b>${S.n}</b>`],['Expectancy / trade',`<b class="${c(S.exp)}">${m(S.exp,1)}</b>`],['Max drawdown',`<b>${S.dd?m(-S.dd)+' · '+(S.dd/D.cap*100).toFixed(1)+'%':'$0.00'}</b>`]];
 return `<div class="k">${K.map(x=>`<div><span>${x[0]}</span>${x[1]}</div>`).join('')}</div><div class="g" style="grid-template-columns:2fr 1fr"><div class="pn"><h3>Equity curve<small>cumulative net P&amp;L</small></h3>${S.cv.length>1?`<svg viewBox="0 0 500 210" preserveAspectRatio="none"><line x1="0" x2="500" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ln)"/><polyline fill="none" stroke="${S.net>=0?'var(--up)':'var(--dn)'}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${S.cv.map((v,i)=>`${i/(S.cv.length-1)*500},${Y(v)}`).join(' ')}"/></svg><div class="mu">${m(lo)} to ${m(hi)}</div>`:'<span class="mu">Needs two closed trades in this period.</span>'}</div>
 <div class="pn"><h3>Outcomes</h3><div class="donut" style="background:conic-gradient(var(--up) ${wp}%,var(--dn) 0)"><div>${S.n?Math.round(wp)+'%':'–'}</div></div><p class="mu" style="text-align:center">${S.w} wins · ${S.n-S.w} losses</p></div></div>
 <div class="g"><div class="pn"><h3>Performance by symbol</h3>${bars(grp(M.C,t=>t.sym,M))}</div><div class="pn"><h3>Performance by session (IST)</h3>${bars(grp(M.C,t=>ses(t.t0),M))}</div></div>`}
function tr(M){const I=M.I,OF=M.O.filter(t=>!M.y||t.sym==M.y);let H=[...M.C].reverse();if(rf=='w')H=H.filter(t=>M.net(t)>0);if(rf=='l')H=H.filter(t=>M.net(t)<=0);
 return `<div class="pn" style="margin-bottom:16px"><h3>Open positions<small>${OF.length}</small></h3><div class="w">${OF.length?`<table><tr><th>Symbol</th><th>Side</th><th>Volume</th><th>Open price</th><th>Current</th><th>S/L</th><th>T/P 1</th><th>T/P 2</th><th>Realised</th><th>Floating</th><th>Opened (IST)</th></tr>`+OF.map(t=>{const l=D.last[t.sym],f=M.fl(t);return `<tr><td>${t.sym}${I[t.sym]&&!I[t.sym].ok?' <span class="warn" title="Needs bar feed or Settings">⚠</span>':''}</td><td class="${t.side>0?'up':'dn'}">${t.side>0?'BUY':'SELL'}</td><td>${t.qo}/${t.q}</td><td>${t.entry}</td><td>${l?l.p:'–'}</td><td>${t.sl}</td><td>${t.tp1}</td><td>${t.tp2}</td><td class="${c(M.net(t))}">${m(M.net(t),1)}</td><td class="${c(f)}"><b>${l?m(f,1):'–'}</b></td><td>${ist(t.t0)}</td></tr>`}).join('')+'</table>':'<span class="mu">No open positions.</span>'}</div></div>
 <div class="pn"><h3>History<small>${H.length} trades</small> <select id="rf" class="b" style="float:right"><option value="">All</option><option value="w"${rf=='w'?' selected':''}>Wins</option><option value="l"${rf=='l'?' selected':''}>Losses</option></select> <button class="b" id="ex" style="float:right;margin-right:8px">Export CSV</button></h3><div class="w">${H.length?`<table><tr><th>Closed (IST)</th><th>Symbol</th><th>Side</th><th>Volume</th><th>Open</th><th>Close avg</th><th>Held</th><th>R</th><th>Gross</th><th>Costs</th><th>Net</th></tr>`+H.slice(0,400).map(t=>`<tr><td>${ist(t.t1)}</td><td>${t.sym}</td><td class="${t.side>0?'up':'dn'}">${t.side>0?'BUY':'SELL'}</td><td>${t.q}</td><td>${t.entry}</td><td>${t.xn?(t.xs/t.xn).toFixed(2):'–'}</td><td>${dur(t.t1-t.t0)}</td><td class="${c(M.net(t))}">${M.rr(t).toFixed(2)}</td><td class="${c(t.gross)}">${m(t.gross,1)}</td><td>${m(-t.comm)}</td><td class="${c(M.net(t))}"><b>${m(M.net(t),1)}</b></td></tr>`).join('')+'</table>':'<span class="mu">No closed trades.</span>'}</div></div>`}
function ca(M){const dy={},cn={};M.CA.forEach(t=>{dy[t.day]=(dy[t.day]||0)+M.net(t);cn[t.day]=(cn[t.day]||0)+1});const n=new Date(),f=cm||new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),1)),Y=f.getUTCFullYear(),Mo=f.getUTCMonth(),
 lead=(f.getUTCDay()+6)%7,nd=new Date(Date.UTC(Y,Mo+1,0)).getUTCDate(),tk=new Date(M.sod).toISOString().slice(0,10),mk=f.toISOString().slice(0,7);
 let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Week'].map(x=>`<u>${x}</u>`).join(''),wk=0,wc=0,pdn=0,ldn=0;
 for(let i=0;i<Math.ceil((lead+nd)/7)*7;i++){const d=i-lead+1;if(d>=1&&d<=nd){const k=new Date(Date.UTC(Y,Mo,d)).toISOString().slice(0,10),v=dy[k];if(v!=null){wk+=v;wc+=cn[k];v>0?pdn++:ldn++}
  h+=`<i data-k="${k}" class="${k==sel?'sel ':''}${k==tk?'td':''}" style="${v==null?'':`background:color-mix(in srgb,var(--${v>=0?'up':'dn'}) ${Math.min(45,12+Math.abs(v)/10)}%,var(--p2))`}"><span>${d}</span><b class="${c(v)}">${v==null?'':m(v,1)}</b><em>${v==null?'':cn[k]+' trade'+(cn[k]>1?'s':'')}</em></i>`}else h+='<i class="off"></i>';
  if(i%7==6){h+=`<i class="wk"><span>Week ${i/7+1}</span><b class="${c(wk)}">${m(wk,1)}</b><em>${wc} trades</em></i>`;wk=wc=0}}
 const ML=M.CA.filter(t=>t.day&&t.day.startsWith(mk)),S=st(ML,M),D1=M.CA.filter(t=>t.day==sel).sort((a,b)=>a.t1-b.t1);
 return `<div class="g" style="grid-template-columns:3fr 1fr"><div class="pn"><h3>${f.toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})}<span style="float:right"><button class="b" id="pm">←</button> <button class="b" id="tm">Today</button> <button class="b" id="nm">→</button></span></h3><div class="cal" id="cal">${h}</div><p class="mu">Closed-trade P&amp;L by exit day. A day ends at 05:30 IST.</p></div>
 <div><div class="pn" style="margin-bottom:16px"><h3>Month at a glance</h3>${[['Net P&L',`<b class="${c(S.net)}">${m(S.net,1)}</b>`],['Closed trades',S.n],['Win rate',S.n?(S.w/S.n*100).toFixed(1)+'%':'0.0%'],['Profitable days',pdn],['Losing days',ldn]].map(x=>`<div class="bar" style="grid-template-columns:1fr auto"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 <div class="pn"><h3>${sel||'Select a day'}</h3>${sel?(D1.length?D1.map(t=>`<div class="bar" style="grid-template-columns:1fr auto"><span>${t.sym} <span class="${t.side>0?'up':'dn'}">${t.side>0?'BUY':'SELL'}</span> ×${t.q}<br><span class="mu">${ist(t.t1)} · ${M.rr(t).toFixed(2)}R</span></span><b class="${c(M.net(t))}">${m(M.net(t),1)}</b></div>`).join(''):'<span class="mu">No closed trades.</span>'):'<span class="mu">Click a date to review its trades.</span>'}</div></div></div>`}
function an(M){const S=st(M.C,M),b=grp(M.C,t=>t.side>0?'Buy':'Sell',M),mo=grp(M.C,t=>t.day.slice(0,7),M),R=[['Expectancy / trade',m(S.exp,1)],['Average win',m(S.aw,1)],['Average loss',m(S.al,1)],['Best trade',m(S.best,1)],['Worst trade',m(S.worst,1)],['Average R',S.R.toFixed(2)+'R'],['Longest losing streak',S.ms],['Max drawdown',S.dd?(S.dd/D.cap*100).toFixed(2)+'% of capital':'0%'],['Alert latency (avg)',(()=>{const L=D.trades.filter(t=>t.lat>=0).map(t=>t.lat);return L.length?(L.reduce((a,x)=>a+x,0)/L.length/1e3).toFixed(1)+'s':'–'})()]];
 return `<div class="g"><div class="pn"><h3>Key statistics</h3>${R.map(x=>`<div class="bar" style="grid-template-columns:1fr auto"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="pn"><h3>Buy versus sell</h3>${bars(b)}<h3 style="margin-top:20px">Monthly consistency</h3>${bars(mo)}</div></div>`}
function render(){const M=model();strip(M);$('v').innerHTML={ov,tr,ca,an}[V](M);document.querySelectorAll('nav a').forEach(a=>a.className=a.dataset.v==V?'on':'');
 if($('rf'))$('rf').onchange=e=>{rf=e.target.value;render()};
 if($('ex'))$('ex').onclick=()=>{const r=[['closed_ist','symbol','side','qty','open','close_avg','gross','costs','net'],...[...M.C].reverse().map(t=>[ist(t.t1),t.sym,t.side>0?'BUY':'SELL',t.q,t.entry,t.xn?t.xs/t.xn:'',t.gross,t.comm,M.net(t)])],
  a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='falcontrader-paper.csv';a.click()};
 if($('cal')){$('cal').onclick=e=>{const k=e.target.closest('[data-k]');if(k){sel=k.dataset.k;render()}};const sh=n=>{const f=cm||new Date(Date.UTC(new Date().getUTCFullYear(),new Date().getUTCMonth(),1));cm=n?new Date(Date.UTC(f.getUTCFullYear(),f.getUTCMonth()+n,1)):null;render()};
  $('pm').onclick=()=>sh(-1);$('nm').onclick=()=>sh(1);$('tm').onclick=()=>sh(0)}}
async function go(){try{D=await(await fetch('api/data')).json();const s=$('sy'),v=s.value,o=['<option value="">All symbols</option>',...D.inst.map(i=>`<option>${i.sym}</option>`)].join('');if(s.dataset.o!=o){s.innerHTML=o;s.dataset.o=o;s.value=v}
 $('st').textContent='live · '+new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata'})+' IST';render()}catch(e){$('st').textContent='server unreachable'}}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{V=a.dataset.v;if(D)render()});
$('tM').onclick=()=>{A='MIRROR';$('tM').className='on';$('tR').className='';render()};$('tR').onclick=()=>{A='REAL';$('tR').className='on';$('tM').className='';render()};$('sy').onchange=$('pd').onchange=()=>D&&render();
const fi=()=>{const i=D.inst.find(x=>x.sym==$('fs').value)||{};$('fq').value=i.qty;$('fm').value=i.comm;$('fl').value=i.slip;$('ft').value=i.tick;$('fp').value=i.pv};
$('se').onclick=()=>{$('fc').value=D.cap;$('fs').innerHTML=D.inst.map(i=>`<option>${i.sym}</option>`).join('');fi();$('dl').showModal()};$('fs').onchange=fi;
$('sv').onclick=async()=>{const r=await fetch('api/set',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({secret:$('fk').value,cap:$('fc').value,sym:$('fs').value,qty:$('fq').value,comm:$('fm').value,slip:$('fl').value,tick:$('ft').value,pv:$('fp').value})});if(r.ok){$('dl').close();go()}else alert('Wrong secret')};
go();setInterval(go,5000);
</script></html>
